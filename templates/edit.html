<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Task</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e0e0e;
        --surface: #161616;
        --border: #2a2a2a;
        --accent: #c8f060;
        --accent-dim: #9ab840;
        --text: #f0ede6;
        --muted: #666;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Mono", monospace;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 40px;
        width: 100%;
        max-width: 480px;
        position: relative;
        z-index: 1;
        animation: fadeUp 0.35s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .label {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: 32px;
        color: var(--text);
        margin-bottom: 6px;
      }

      .task-id {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 32px;
        display: block;
      }

      .divider {
        height: 1px;
        background: linear-gradient(90deg, var(--accent) 0%, transparent 70%);
        margin-bottom: 28px;
      }

      label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }

      input[type="text"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: "DM Mono", monospace;
        font-size: 14px;
        padding: 13px 16px;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 28px;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
      }

      .btn-row {
        display: flex;
        gap: 10px;
      }

      .btn-save {
        flex: 1;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: #0e0e0e;
        cursor: pointer;
        font-family: "DM Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        padding: 13px;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .btn-save:hover {
        background: var(--accent-dim);
      }
      .btn-save:active {
        transform: scale(0.97);
      }

      .btn-cancel {
        flex: 1;
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        font-family: "DM Mono", monospace;
        font-size: 13px;
        padding: 13px;
        text-align: center;
        text-decoration: none;
        transition:
          border-color 0.2s,
          color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-cancel:hover {
        border-color: #555;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label">// edit task</p>
      <h1>Edit <span style="color: var(--accent)">Task</span></h1>
      <span class="task-id">task #{{ task.id }}</span>

      <div class="divider"></div>

      <form action="/edit/{{ task.id }}" method="POST">
        <label for="title">Task title</label>
        <input
          type="text"
          id="title"
          name="title"
          value="{{ task.title }}"
          autocomplete="off"
          required
          autofocus
        />
        <div class="btn-row">
          <button class="btn-save" type="submit">✓ Save Changes</button>
          <a class="btn-cancel" href="/">✕ Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
